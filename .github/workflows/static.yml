name: Update Clash Royale ladder DB

on:
  schedule:
    - cron: "*/59 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: clash-royale-db
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run logger
        env:
          PLAYER_TAG_RAW: ${{ secrets.CR_PLAYER_TAG }}
          BEARER_TOKEN: ${{ secrets.CR_BEARER_TOKEN }}
        run: python clash_logger.py

      - name: Commit updated database
        run: |
          git config user.name "cr-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add clash_royale_ladder.db
          git diff --staged --quiet || git commit -m "Update ladder battle log [skip ci]"
          git pull origin main
          git push
